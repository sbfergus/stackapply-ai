<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      color: #f8fafc;
    }
    
    /* Toggle Switch Styles */
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .toggle-label {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      white-space: nowrap;
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-switch input:disabled + .toggle-slider {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .toggle-slider {
      position: absolute;
      cursor: not-allowed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: 0.3s;
      border-radius: 22px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #64748b;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: #6366f1;
    }
    input:checked + .toggle-slider:before {
      background-color: #ffffff;
      transform: translateX(18px);
    }
    
    /* Tooltip */
    .toggle-container .tooltip {
      visibility: hidden;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background-color: #1e293b;
      color: #94a3b8;
      text-align: right;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10px;
      white-space: nowrap;
      border: 1px solid #334155;
      z-index: 1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .toggle-container .tooltip::before {
      content: '';
      position: absolute;
      bottom: 100%;
      right: 12px;
      border: 5px solid transparent;
      border-bottom-color: #334155;
    }
    .toggle-container:hover .tooltip {
      visibility: visible;
    }
    
    .field-group {
      margin-bottom: 12px;
    }
    .field-row {
      display: flex;
      gap: 8px;
    }
    .field-row .field-group {
      flex: 1;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
      font-family: inherit;
      height: 37px;
    }
    textarea {
      height: auto;
      min-height: 80px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1;
    }
    textarea {
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4338ca;
    }
    button:disabled {
      background-color: #334155;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ StackApply AI</h2>
    <div class="toggle-container">
      <span class="toggle-label">Use AI</span>
      <label class="toggle-switch">
        <input type="checkbox" id="use-ai-toggle" disabled>
        <span class="toggle-slider"></span>
      </label>
      <span class="tooltip">Add AI Keys to Activate</span>
    </div>
  </div>

  <div class="field-group">
    <label for="title">Job Title</label>
    <input type="text" id="title" placeholder="e.g. Senior Frontend Engineer" />
  </div>

  <div class="field-group">
    <label for="company">Company</label>
    <input type="text" id="company" placeholder="e.g. Vercel" />
  </div>

  <div class="field-row">
    <div class="field-group">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="e.g. Denver, CO" />
    </div>
    <div class="field-group">
      <label for="workSetting">Setting</label>
      <select id="workSetting">
        <option value="REMOTE">Remote</option>
        <option value="HYBRID">Hybrid</option>
        <option value="IN_OFFICE">In-Office</option>
      </select>
    </div>
  </div>

  <div class="field-row">
    <div class="field-group">
      <label for="salaryMin">Min Salary ($)</label>
      <input type="number" id="salaryMin" placeholder="130000" />
    </div>
    <div class="field-group">
      <label for="salaryMax">Max Salary ($)</label>
      <input type="number" id="salaryMax" placeholder="170000" />
    </div>
  </div>

  <div class="field-group">
    <label for="techStack">Tech Stack</label>
    <input type="text" id="techStack" placeholder="React, TypeScript, Next.js" />
  </div>

  <div class="field-group">
    <label for="roleSummary">Role Summary</label>
    <textarea id="roleSummary" placeholder="Brief job overview..."></textarea>
  </div>

  <div class="field-group">
    <label for="companyOverview">Company Overview</label>
    <textarea id="companyOverview" placeholder="Brief company description..."></textarea>
  </div>

  <div class="field-group">
    <label for="benefits">Perks & Benefits</label>
    <input type="text" id="benefits" placeholder="401k, Health Insurance, Remote Work" />
  </div>

  <button id="save-btn">Save to Dashboard</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
