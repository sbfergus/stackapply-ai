<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Save to StackApply AI</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #4f46e5;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
    }
    h2 {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1;
    }
    .tech-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }
    .tag {
      font-size: 10px;
      background-color: #334155;
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #4338ca;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status-msg.success {
      color: #34d399;
      display: block;
    }
    .status-msg.error {
      color: #f87171;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <h2>StackApply AI</h2>
  </div>

  <div class="form-group">
    <label>Job Title</label>
    <input type="text" id="title" placeholder="e.g. Senior Frontend Engineer" />
  </div>

  <div class="form-group">
    <label>Company</label>
    <input type="text" id="company" placeholder="e.g. Vercel" />
  </div>

  <div class="form-group">
    <label>Location / Work Setting</label>
    <input type="text" id="location" placeholder="e.g. Remote (US)" />
  </div>

  <div class="form-group">
    <label>Detected Tech Stack</label>
    <input type="text" id="techStack" placeholder="React, TypeScript, Next.js" />
  </div>

  <button class="btn" id="saveBtn">Save to Dashboard</button>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
